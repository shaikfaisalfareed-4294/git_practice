#!/bin/bash
apt update -y
apt install -y nginx

systemctl enable --now nginx

cat > /usr/share/nginx/html/index.html <<'EOF'
<!DOCTYPE html>
<html>
<head>
    <title>AWS Nginx Web Server</title>
</head>
<body style="font-family: Arial, sans-serif; text-align: center; padding-top: 100px; background-color: #e8f4ff;">
    <h1>Welcome to AWS!</h1>
    <h2>Nginx Web Server Running Successfully</h2>
    <p>Deployed using EC2 User Data</p>
    <p>Application Load Balancer Lab</p>
</body>
</html>
EOF
